name: AURA CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-web-portal:
    name: Web Portal Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Web Test Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Portal Browser Tests
        run: npm run test:web

  # ===========================================================================
  # 1. JAVA ENTERPRISE BACKEND & DESKTOP CI
  # Compiles Java 17 source, executes automated tests, packages executable fat JAR,
  # and archives the standalone desktop artifact for team distribution.
  # ===========================================================================
  build-and-test-java:
    name: Java 17 CI & Standalone JAR Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Database Credentials
        shell: bash
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$DB_URL" ] && [ -n "$DB_USER" ]; then
            echo "Generating db.properties from GitHub Secrets..."
            cat <<EOF > src/main/resources/db.properties
          db.url=$DB_URL
          db.user=$DB_USER
          db.password=$DB_PASSWORD
          db.driver=org.postgresql.Driver
          EOF
          else
            echo "Using default fallback configuration from db.properties.example..."
            cp src/main/resources/db.properties.example src/main/resources/db.properties
          fi

      - name: Compile and Run Automated Tests
        shell: bash
        run: mvn -B clean test

      - name: Package Executable Standalone Fat JAR
        shell: bash
        run: mvn -B package -DskipTests=true

      - name: Archive Executable JAR as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Desktop-Application
          path: target/aura.jar
          retention-days: 30

  # ===========================================================================
  # 2. VERCEL WEB & MOBILE PORTAL CD
  # Automatically deploys the responsive PWA web portal to Vercel on push to main
  # ===========================================================================
  deploy-web-portal:
    name: Deploy Web Portal to Vercel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [ build-and-test-java, test-web-portal ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_lsQBunCOAUIAvYzc9H8uioq6
          VERCEL_PROJECT_ID: prj_NlRpX9xTiEKHP8CWSt9vMcJmj2YY
        run: |
          echo "Deploying to Vercel production with project scope..."
          vercel deploy --prod --yes --token=$VERCEL_TOKEN
